<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aexinide Wallpapers</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>aexinide<span>/wallpapers</span></h1>
      <p>
        Wallpapers I use on my Ubuntu desktop, shared for anyone who wants them.
        <b id="count"></b>
      </p>
      <p class="links">
        <a href="https://github.com/aexinide/wallpapers">source on GitHub</a>
      </p>
    </header>
    <main class="grid"></main>
    <div id="sentinel"></div>
    <footer>
      Images belong to their original creators and are shared for personal use.
      Made one of these and want it credited or removed?
      <a href="https://github.com/aexinide/wallpapers/issues">Open an issue</a>.
    </footer>
    <script src="app.js"></script>
  </body>
</html>
